packages:
  - packages/*

# Intended to mitigate supply chain attacks
minimumReleaseAge: 1440
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - astro
  - '@astrojs/*'
  - '@xsynaptic/*'
  - '@takumi-rs/*'
  - takumi-js

# TypeScript 7 native binaries for fallow's type-aware mode, which this project does not use
ignoredOptionalDependencies:
  - fallow-type-aware

overrides:
  '@napi-rs/wasm-runtime@1.2.4>@emnapi/runtime': 1.11.3

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y@6.10.2 caps its eslint peer at ^9 but uses no APIs removed in ESLint 10
    # Safe to run on 10 until upstream widens the range
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  # Binary ships via the @cloudflare/workerd-* optional dep; postinstall only validates/optimizes
  workerd: false

permissions:
  fallow:
    skills: false
