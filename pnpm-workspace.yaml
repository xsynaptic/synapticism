packages:
  - packages/**

# Intended to mitigate supply chain attacks
minimumReleaseAge: 1440
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - astro
  - satteri
  - '@bruits/*'
  - '@astrojs/*'
  - '@xsynaptic/*'

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y@6.10.2 caps its eslint peer at ^9 but uses no APIs removed in ESLint 10
    # Safe to run on 10 until upstream widens the range
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  esbuild: true
  sharp: true
  satteri: true
  # Binary ships via the @cloudflare/workerd-* optional dep; postinstall only validates/optimizes
  workerd: false
  # Native binding for the build-time word-count SQLite cache (@keyv/sqlite)
  sqlite3: true
