packages:
  - packages/*

# Intended to mitigate supply chain attacks
minimumReleaseAge: 2880
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - astro
  - satteri
  - '@bruits/*'
  - '@astrojs/*'
  - '@xsynaptic/*'

# TypeScript 7 native binaries for fallow's type-aware mode, which this project does not use
ignoredOptionalDependencies:
  - fallow-type-aware

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y@6.10.2 caps its eslint peer at ^9 but uses no APIs removed in ESLint 10
    # Safe to run on 10 until upstream widens the range
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  satteri: true
  # Binary ships via the @cloudflare/workerd-* optional dep; postinstall only validates/optimizes
  workerd: false

permissions:
  fallow:
    skills: false
